<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gemini AI タスク自動優先順位アプリ (Voice & Cloud Sync)</title>
  <style>
    :root {
      --primary: #4f46e5;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #1e293b;
      --text-sub: #64748b;
      --high-bg: #ef4444;
      --med-bg: #f59e0b;
      --low-bg: #10b981;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      max-width: 520px;
      margin: 0 auto;
      padding: 20px 16px;
      background-color: var(--bg);
      color: var(--text-main);
      box-sizing: border-box;
    }

    h2 { font-size: 1.35rem; font-weight: 700; text-align: center; margin-bottom: 20px; color: var(--primary); }

    .form-box {
      background: var(--card-bg);
      padding: 18px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
      margin-bottom: 20px;
    }

    .sync-status {
      font-size: 0.78rem;
      font-weight: 600;
      color: #059669;
      text-align: right;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 4px;
    }

    .sync-dot {
      width: 8px;
      height: 8px;
      background-color: #10b981;
      border-radius: 50%;
      display: inline-block;
    }

    label { font-size: 0.85rem; font-weight: 600; color: var(--text-sub); display: block; margin-bottom: 4px; }

    .input-group {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }

    input[type="text"], input[type="date"] {
      padding: 10px;
      width: 100%;
      box-sizing: border-box;
      font-size: 15px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      outline: none;
    }

    .mic-btn {
      background-color: #0284c7;
      color: white;
      border: none;
      padding: 0 14px;
      border-radius: 8px;
      font-size: 1.1rem;
      cursor: pointer;
      white-space: nowrap;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .mic-btn.recording {
      background-color: #ef4444;
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.5; }
      100% { opacity: 1; }
    }

    button#addBtn {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      width: 100%;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 5px;
    }

    button:disabled { background-color: #94a3b8 !important; cursor: not-allowed; }

    h3 { font-size: 1rem; font-weight: 700; margin-bottom: 12px; }
    ul { list-style: none; padding: 0; margin: 0; }

    li {
      background: var(--card-bg);
      padding: 16px;
      margin-bottom: 12px;
      border-radius: 12px;
      box-shadow: 0 1px 3px 0 rgba(0,0,0,0.05);
      border-left: 4px solid #cbd5e1;
    }

    li.high-border { border-left-color: var(--high-bg); }
    li.med-border { border-left-color: var(--med-bg); }
    li.low-border { border-left-color: var(--low-bg); }
    li.alert-near { background: #fef2f2; }

    .task-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .task-title { font-size: 0.98rem; font-weight: 600; word-break: break-all; }
    .reason { font-size: 0.82rem; color: var(--text-sub); margin-top: 8px; background: #f1f5f9; padding: 8px 10px; border-radius: 6px; }
    .priority { font-weight: 700; padding: 4px 8px; border-radius: 6px; color: white; font-size: 0.75rem; white-space: nowrap; }

    .high { background: var(--high-bg); }
    .med { background: var(--med-bg); }
    .low { background: var(--low-bg); }

    .alert-badge { background: var(--high-bg); color: white; font-size: 0.7rem; padding: 2px 6px; border-radius: 10px; margin-left: 6px; animation: blink 1.5s infinite; }
    @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }

    .task-footer { display: flex; justify-content: flex-end; gap: 6px; margin-top: 12px; flex-wrap: wrap; }
    .action-btn { padding: 6px 12px; font-size: 0.78rem; font-weight: 600; text-decoration: none; border-radius: 6px; border: none; cursor: pointer; }
    .cal-btn { background-color: #059669; color: white; }
    .edit-btn { background-color: #0284c7; color: white; }
    .delete-btn { background-color: #64748b; color: white; }
    .restore-btn { background-color: var(--primary); color: white; }
    .purge-btn { background-color: var(--high-bg); color: white; }

    .history-section { margin-top: 32px; border-top: 1px solid #e2e8f0; padding-top: 16px; }
    .history-header { display: flex; justify-content: space-between; align-items: center; }
    .toggle-btn { width: auto; padding: 5px 12px; background-color: #64748b; font-size: 0.78rem; border-radius: 6px; color: white; border: none; cursor: pointer; }
    .history-content { display: none; margin-top: 12px; }
    .history-content.open { display: block; }
    .history-item { background: #f1f5f9; color: var(--text-sub); border-left: 4px solid #94a3b8; }
    .history-item .task-title { text-decoration: line-through; opacity: 0.8; }
  </style>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot, doc, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Firebase 設定
    const firebaseConfig = {
      apiKey: "AIzaSyAY1DsYVnGichuqaU9siVR5UbydAgB10Rg",
      authDomain: "my-task-app-a10e2.firebaseapp.com",
      projectId: "my-task-app-a10e2",
      storageBucket: "my-task-app-a10e2.firebasestorage.app",
      messagingSenderId: "693299176256",
      appId: "1:693299176256:web:0147167265daa8e85d10a5",
      measurementId: "G-Q7D8HWVDCD"
    };

    // ▼ ご自身の Gemini APIキー（AIzaSy...）を貼り付けます
    const GEMINI_API_KEY = "AQ.Ab8RN6JmcwC6A5t6k-t1bhIHs6FDHxNnoplDJA1ieiGkI1eG6g";

    let db;
    let tasks = [];
    let deletedTasks = [];
    let editingId = null;

    try {
      const app = initializeApp(firebaseConfig);
      db = getFirestore(app);
      initRealtimeSync();
    } catch (e) {
      console.error('Firebase 初期化エラー:', e);
      document.getElementById('syncStatus').innerHTML = '<span style="color:#ef4444;">⚠️ クラウド未接続</span>';
    }

    function initRealtimeSync() {
      onSnapshot(collection(db, "active_tasks"), (snapshot) => {
        tasks = [];
        snapshot.forEach((doc) => {
          tasks.push({ id: doc.id, ...doc.data() });
        });
        checkAlertsAndSort();
        renderTasks();
      });

      onSnapshot(collection(db, "deleted_tasks"), (snapshot) => {
        deletedTasks = [];
        snapshot.forEach((doc) => {
          deletedTasks.push({ id: doc.id, ...doc.data() });
        });
        deletedTasks.sort((a, b) => b.deletedAt - a.deletedAt);
        renderTasks();
      });
    }

    function checkAlertsAndSort() {
      const today = new Date();
      today.setHours(0, 0, 0, 0);

      tasks.forEach(t => {
        if (!t.date) {
          t.isNear = false;
          t.diffDays = 999;
          return;
        }
        const target = new Date(t.date);
        target.setHours(0, 0, 0, 0);
        const diff = Math.ceil((target - today) / (1000 * 60 * 60 * 24));
        t.diffDays = diff;
        t.isNear = (diff <= 3);
      });

      tasks.sort((a, b) => {
        const aTop = (a.diffDays <= 1);
        const bTop = (b.diffDays <= 1);

        if (aTop && !bTop) return -1;
        if (!aTop && bTop) return 1;
        return b.score - a.score;
      });
    }

    // --- 音声入力機能 (Speech Recognition) ---
    window.startSpeech = function() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert('お使いのブラウザは音声入力に対応していません。ChromeやSafariをお試しください。');
        return;
      }

      const recognition = new SpeechRecognition();
      recognition.lang = 'ja-JP';
      const micBtn = document.getElementById('micBtn');

      recognition.onstart = () => {
        micBtn.classList.add('recording');
        micBtn.innerText = '🔴 録音中...';
      };

      recognition.onend = () => {
        micBtn.classList.remove('recording');
        micBtn.innerText = '🎤 音声';
      };

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        document.getElementById('taskInput').value = transcript;
      };

      recognition.start();
    };

    window.addTaskWithAI = async function() {
      const btn = document.getElementById('addBtn');
      const text = document.getElementById('taskInput').value.trim();
      const dateVal = document.getElementById('dateInput').value;

      if (!GEMINI_API_KEY || GEMINI_API_KEY === "ここにGeminiのAPIキー") {
        alert('コード内の GEMINI_API_KEY に正しいGemini APIキーを設定してください！');
        return;
      }
      if (!text) {
        alert('タスク内容を入力してください！');
        return;
      }

      btn.disabled = true;
      btn.innerText = 'AIが分析中...';

      try {
        const todayStr = new Date().toISOString().split('T')[0];
        const dateInfo = dateVal ? `手動指定された期限: "${dateVal}"` : "期限未指定 (文章から日付を自動推測してください)";

        const prompt = `
今日の日付は "${todayStr}" です。
以下のタスク文章を分析し、優先順位スコア（1〜100）、優先度（高/中/低）、1文の理由、および文章内に含まれる日付情報（例: 明日, 来週火曜, 12日など）から推測される YYYY-MM-DD 形式の期限を出力してください。

入力内容: "${text}"
${dateInfo}

【ルール】
- 文章から日付が特定できる場合、extractedDate に YYYY-MM-DD 形式で設定してください。手動指定の期限がある場合はそれを優先します。特定できない場合は null にしてください。
- 抽出後のタスク本文 (cleanText) からは「明日」「来週火曜」などの日付単語を取り除いた純粋なタスク名に整えてください。

以下のJSON形式のみで回答してください:
{"score": 85, "priority": "高", "reason": "理由を1文で簡潔に", "extractedDate": "YYYY-MM-DDまたはnull", "cleanText": "整形後のタスク名"}
`;

        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${GEMINI_API_KEY}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
        });

        const data = await response.json();
        if (data.error) throw new Error(data.error.message);

        const rawText = data.candidates[0].content.parts[0].text.replace(/```json|```/g, '').trim();
        const aiResult = JSON.parse(rawText);

        let priorityClass = 'low';
        if (aiResult.priority === '高') priorityClass = 'high';
        else if (aiResult.priority === '中') priorityClass = 'med';

        // 手動入力の日付を優先、無ければAI抽出日付を採用
        const finalDate = dateVal ? dateVal : (aiResult.extractedDate || '');
        const finalTaskText = aiResult.cleanText || text;

        const taskId = editingId ? editingId : String(Date.now());
        const taskData = {
          text: finalTaskText,
          date: finalDate,
          score: aiResult.score,
          priorityLabel: aiResult.priority,
          priorityClass: priorityClass,
          reason: aiResult.reason,
          updatedAt: Date.now()
        };

        await setDoc(doc(db, "active_tasks", taskId), taskData);

        editingId = null;
        document.getElementById('taskInput').value = '';
        document.getElementById('dateInput').value = '';

      } catch (error) {
        alert('エラーが発生しました: ' + error.message);
      } finally {
        btn.disabled = false;
        btn.innerText = 'AIで優先度を判定して保存';
      }
    };

    window.editTask = function(id) {
      const task = tasks.find(t => String(t.id) === String(id));
      if (!task) return;
      document.getElementById('taskInput').value = task.text;
      document.getElementById('dateInput').value = task.date || '';
      editingId = String(id);
      const btn = document.getElementById('addBtn');
      btn.innerText = '変更をAIで再評価して更新';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    window.deleteTask = async function(id) {
      const task = tasks.find(t => String(t.id) === String(id));
      if (!task) return;

      await deleteDoc(doc(db, "active_tasks", String(id)));
      await setDoc(doc(db, "deleted_tasks", String(id)), {
        ...task,
        deletedAt: Date.now()
      });
    };

    window.restoreTask = async function(id) {
      const task = deletedTasks.find(t => String(t.id) === String(id));
      if (!task) return;

      await deleteDoc(doc(db, "deleted_tasks", String(id)));
      delete task.deletedAt;
      await setDoc(doc(db, "active_tasks", String(id)), task);
    };

    window.purgeTask = async function(id) {
      if (confirm('完全に消去しますか？')) {
        await deleteDoc(doc(db, "deleted_tasks", String(id)));
      }
    };

    window.toggleHistory = function() {
      const content = document.getElementById('historyContent');
      const btn = document.getElementById('toggleBtn');
      if (content.classList.contains('open')) {
        content.classList.remove('open');
        btn.innerText = '開く ▼';
      } else {
        content.classList.add('open');
        btn.innerText = '閉じる ▲';
      }
    };

    function renderTasks() {
      const list = document.getElementById('taskList');
      list.innerHTML = '';
      if (tasks.length === 0) {
        list.innerHTML = '<li style="background:none; color:var(--text-sub); text-align:center;">タスクはありません</li>';
      } else {
        tasks.forEach(t => {
          const li = document.createElement('li');
          li.classList.add(`${t.priorityClass}-border`);
          if (t.isNear) li.classList.add('alert-near');

          const dateDisplay = t.date ? `(${t.date})` : '<span style="color:var(--text-sub);">[期限なし]</span>';
          const alertBadge = t.isNear ? '<span class="alert-badge">⚠️ 期限間近</span>' : '';
          let calBtnHtml = '';
          if (t.date) {
            const formattedDate = t.date.replace(/-/g, '');
            const calUrl = `https://www.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(t.text)}&dates=${formattedDate}/${formattedDate}`;
            calBtnHtml = `<a href="${calUrl}" target="_blank" class="action-btn cal-btn">📅 カレンダー</a>`;
          }

          li.innerHTML = `
            <div class="task-header">
              <span class="task-title">${t.text} ${dateDisplay} ${alertBadge}</span>
              <span class="priority ${t.priorityClass}">${t.priorityLabel} (${t.score}点)</span>
            </div>
            <div class="reason">💡 AI理由: ${t.reason}</div>
            <div class="task-footer">
              ${calBtnHtml}
              <button class="action-btn edit-btn" onclick="editTask('${t.id}')">編集</button>
              <button class="action-btn delete-btn" onclick="deleteTask('${t.id}')">削除</button>
            </div>
          `;
          list.appendChild(li);
        });
      }

      const historyList = document.getElementById('historyList');
      historyList.innerHTML = '';
      if (deletedTasks.length === 0) {
        historyList.innerHTML = '<li style="background:none; color:var(--text-sub); text-align:center;">削除された履歴はありません</li>';
      } else {
        deletedTasks.forEach(t => {
          const li = document.createElement('li');
          li.classList.add('history-item');
          const dateDisplay = t.date ? `(${t.date})` : '[期限なし]';
          li.innerHTML = `
            <div class="task-header"><span class="task-title">${t.text} ${dateDisplay}</span></div>
            <div class="task-footer">
              <button class="action-btn restore-btn" onclick="restoreTask('${t.id}')">↩️ 元に戻す</button>
              <button class="action-btn purge-btn" onclick="purgeTask('${t.id}')">完全消去</button>
            </div>
          `;
          historyList.appendChild(li);
        });
      }
    }
  </script>
</head>
<body>

  <h2>✨ Gemini AI タスクメモ (Voice & Sync)</h2>

  <div class="sync-status" id="syncStatus">
    <span class="sync-dot"></span> クラウド自動同期中
  </div>

  <div class="form-box">
    <label>タスク・メモ内容</label>
    <div class="input-group">
      <input type="text" id="taskInput" placeholder="例: 明日の午後に単行本を捨てる">
      <button type="button" class="mic-btn" id="micBtn" onclick="startSpeech()">🎤 音声</button>
    </div>

    <label>期限 (任意・音声からも自動抽出可)</label>
    <input type="date" id="dateInput">

    <button id="addBtn" type="button" onclick="addTaskWithAI()">AIで優先度を判定して保存</button>
  </div>

  <h3>📋 実行中のタスク</h3>
  <ul id="taskList"></ul>

  <div class="history-section">
    <div class="history-header">
      <h3>🗑️ 削除・完了履歴</h3>
      <button type="button" class="toggle-btn" id="toggleBtn" onclick="toggleHistory()">開く ▼</button>
    </div>
    <div class="history-content" id="historyContent">
      <ul id="historyList"></ul>
    </div>
  </div>

</body>
</html>
